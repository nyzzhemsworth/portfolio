<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="avclip"><rect x="540" y="70" width="120" height="120" rx="30"/></clipPath>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>

  <!-- ============ BG sky wash + blobs ============ -->
  <rect width="1200" height="630" fill="#dceeff"/>
  <g filter="url(#soft)">
    <circle cx="70" cy="470" r="150" fill="#4da2ff" opacity="0.34"/>
    <circle cx="1120" cy="120" r="170" fill="#ffffff" opacity="0.85"/>
    <circle cx="960" cy="580" r="140" fill="#55db9c" opacity="0.26"/>
    <circle cx="130" cy="110" r="120" fill="#ffd731" opacity="0.30"/>
  </g>
  <path d="M0,590 C260,440 470,630 760,510 C980,424 1110,540 1200,496" stroke="#1555a6" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.14"/>
  <path d="M0,586 C260,436 470,626 760,506 C980,420 1110,536 1200,492" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- ============ Top marquee bar ============ -->
  <rect x="0" y="0" width="1200" height="46" fill="#000000"/>
  <text x="600" y="30" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="16" letter-spacing="3" fill="#ffffff">ZIELL • @T4RAKE  ✦  VIDEO EDITING  ✦  WEB DEV  ✦  OPEN FOR COLLAB</text>

  <!-- ============ Avatar card ============ -->
  <rect x="534" y="64" width="132" height="132" rx="34" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <g clip-path="url(#avclip)">
    <image href="pswsbhar.jpg" xlink:href="pswsbhar.jpg" x="540" y="70" width="120" height="120" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- ============ Name ============ -->
  <text x="600" y="412" text-anchor="middle" font-family="Anton" font-size="215" letter-spacing="4" fill="#000000">ZIELL</text>

  <!-- ============ Handle pill ============ -->
  <rect x="430" y="440" width="340" height="46" rx="23" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="600" y="471" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="17" letter-spacing="1.5" fill="#000000">@T4RAKE • INDONESIA</text>

  <!-- ============ Role stickers ============ -->
  <!-- VIDEO EDITING (blue) -->
  <g transform="rotate(-2 232 510)">
    <rect x="128" y="489" width="208" height="42" rx="21" fill="#4da2ff" stroke="#000000" stroke-width="2.5"/>
    <text x="232" y="517" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="15.5" letter-spacing="1" fill="#000000">VIDEO EDITING</text>
  </g>
  <!-- WEB DEV (mint) -->
  <g transform="rotate(1.5 452 510)">
    <rect x="376" y="489" width="152" height="42" rx="21" fill="#55db9c" stroke="#000000" stroke-width="2.5"/>
    <text x="452" y="517" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="15.5" letter-spacing="1" fill="#000000">WEB DEV</text>
  </g>
  <!-- BOT &amp; AUTOMATION (ember) -->
  <g transform="rotate(-1.5 718 510)">
    <rect x="618" y="489" width="200" height="42" rx="21" fill="#fb4903" stroke="#000000" stroke-width="2.5"/>
    <text x="718" y="517" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="15.5" letter-spacing="1" fill="#ffffff">BOT &amp; AUTOMATION</text>
  </g>
  <!-- GRAPHIC DESIGN (sunburst) -->
  <g transform="rotate(2 960 510)">
    <rect x="858" y="489" width="204" height="42" rx="21" fill="#ffd731" stroke="#000000" stroke-width="2.5"/>
    <text x="960" y="517" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="15.5" letter-spacing="1" fill="#000000">GRAPHIC DESIGN</text>
  </g>

  <!-- ============ URL pill ============ -->
  <rect x="460" y="558" width="280" height="48" rx="24" fill="#000000"/>
  <text x="600" y="591" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="bold" font-size="19" letter-spacing="1.5" fill="#ffffff">ziellvfx.com</text>

  <!-- sparkle decos -->
  <g fill="#000000" opacity="0.85">
    <path d="M149,58 C150.6,65.6 156.4,71.4 164,73 C156.4,74.6 150.6,80.4 149,88 C147.4,80.4 141.6,74.6 134,73 C141.6,71.4 147.4,65.6 149,58 Z"/>
    <path d="M1052,52 C1053.6,59.6 1059.4,65.4 1067,67 C1059.4,68.6 1053.6,74.4 1052,82 C1050.4,74.4 1044.6,68.6 1037,67 C1044.6,65.4 1050.4,59.6 1052,52 Z"/>
  </g>
</svg>
