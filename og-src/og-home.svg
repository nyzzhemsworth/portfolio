<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="avclip"><rect x="135" y="145" width="164" height="164" rx="34"/></clipPath>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>

  <!-- ============ Background: Sky Wash & Ambient Glow ============ -->
  <rect width="1200" height="630" fill="#dceeff"/>
  <g filter="url(#soft)">
    <circle cx="80" cy="520" r="160" fill="#4da2ff" opacity="0.30"/>
    <circle cx="1140" cy="110" r="180" fill="#ffffff" opacity="0.90"/>
    <circle cx="1020" cy="560" r="150" fill="#55db9c" opacity="0.25"/>
    <circle cx="150" cy="110" r="130" fill="#ffd731" opacity="0.35"/>
  </g>

  <!-- Background playful wave lines -->
  <path d="M0,590 C260,440 470,630 760,510 C980,424 1110,540 1200,496" stroke="#1555a6" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.12"/>
  <path d="M0,586 C260,436 470,626 760,506 C980,420 1110,536 1200,492" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- ============ Top Black Marquee Tape ============ -->
  <rect x="0" y="0" width="1200" height="46" fill="#000000"/>
  <text x="600" y="29" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="14.5" letter-spacing="3" fill="#ffffff">ZIELL • @T4RAKE  ✦  VIDEO EDITING  ✦  WEB DEV  ✦  BOT &amp; AUTOMATION  ✦  OPEN FOR COLLAB</text>

  <!-- ============ Sparkles in Background ============ -->
  <g fill="#000000" opacity="0.85">
    <path d="M50,72 C51.8,81 58.5,87.8 67.5,89.5 C58.5,91.2 51.8,98 50,107 C48.2,98 41.5,91.2 32.5,89.5 C41.5,87.8 48.2,81 50,72 Z"/>
    <path d="M1142,66 C1143.8,75 1150.5,81.8 1159.5,83.5 C1150.5,85.2 1143.8,92 1142,101 C1140.2,92 1133.5,85.2 1124.5,83.5 C1133.5,81.8 1140.2,75 1142,66 Z"/>
    <path d="M1150,560 C1151.5,567 1156.5,572 1163.5,573.5 C1156.5,575 1151.5,580 1150,587 C1148.5,580 1143.5,575 1136.5,573.5 C1143.5,572 1148.5,567 1150,560 Z"/>
  </g>

  <!-- ============ Main Central Neo-brutalist Card ============ -->
  <!-- Hard Shadow -->
  <rect x="88" y="88" width="1040" height="500" rx="36" fill="#000000"/>
  <!-- Card Base -->
  <rect x="78" y="78" width="1040" height="500" rx="36" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>

  <!-- Card Top Badge: CREATOR PORTFOLIO -->
  <rect x="120" y="104" width="200" height="30" rx="15" fill="#f0f4f8" stroke="#000000" stroke-width="2"/>
  <text x="220" y="124" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="11.5" letter-spacing="1.5" fill="#000000">CREATOR PORTFOLIO</text>

  <!-- ============ Left Column: Avatar & Collab Sticker ============ -->
  <!-- Avatar shadow + card -->
  <rect x="133" y="149" width="172" height="172" rx="38" fill="#000000"/>
  <rect x="129" y="145" width="172" height="172" rx="38" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <g clip-path="url(#avclip)">
    <image href="pswsbhar.jpg" xlink:href="pswsbhar.jpg" x="133" y="149" width="164" height="164" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Open for Collab Sticker (tilted) -->
  <g transform="rotate(-2 215 352)">
    <rect x="113" y="333" width="204" height="40" rx="20" fill="#000000"/>
    <rect x="109" y="329" width="204" height="40" rx="20" fill="#ffd731" stroke="#000000" stroke-width="2.5"/>
    <text x="211" y="354" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="13" letter-spacing="0.8" fill="#000000">✦ OPEN FOR COLLAB</text>
  </g>

  <!-- ============ Right Column: Handle, Name & Info ============ -->
  <!-- Handle & Location pill -->
  <rect x="350" y="104" width="260" height="32" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="480" y="125" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="13" letter-spacing="1.2" fill="#000000">@T4RAKE  •  INDONESIA</text>

  <!-- Big Name in Syne -->
  <text x="350" y="222" font-family="Syne" font-weight="800" font-size="92" letter-spacing="-1" fill="#000000">ZIELL</text>

  <!-- Headline sticker -->
  <g transform="rotate(-1 530 250)">
    <rect x="350" y="238" width="360" height="32" rx="16" fill="#fb4903" stroke="#000000" stroke-width="2"/>
    <text x="530" y="260" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="14" letter-spacing="1.5" fill="#ffffff">MULTI-DISCIPLINARY CREATOR</text>
  </g>

  <!-- Taglines / Intro -->
  <text x="350" y="310" font-family="Plus Jakarta Sans" font-weight="800" font-size="20" fill="#111111">Building things across video, design, and code.</text>
  <text x="350" y="340" font-family="Plus Jakarta Sans" font-weight="600" font-size="16" fill="#444444">Official link hub, client direct contact, and creative projects.</text>

  <!-- Dashed divider -->
  <line x1="110" y1="392" x2="1080" y2="392" stroke="#000000" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- ============ Bottom Section: Role Stickers & URL ============ -->
  <!-- Sticker 1: Video Editing -->
  <g transform="rotate(-1.5 220 442)">
    <rect x="114" y="420" width="194" height="46" rx="23" fill="#000000"/>
    <rect x="110" y="416" width="194" height="46" rx="23" fill="#4da2ff" stroke="#000000" stroke-width="2.5"/>
    <text x="207" y="445" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="14.5" letter-spacing="1" fill="#000000">VIDEO EDITING</text>
  </g>

  <!-- Sticker 2: Web Dev -->
  <g transform="rotate(1.5 390 442)">
    <rect x="314" y="420" width="154" height="46" rx="23" fill="#000000"/>
    <rect x="310" y="416" width="154" height="46" rx="23" fill="#55db9c" stroke="#000000" stroke-width="2.5"/>
    <text x="387" y="445" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="14.5" letter-spacing="1" fill="#000000">WEB DEV</text>
  </g>

  <!-- Sticker 3: Bot & Automation -->
  <g transform="rotate(-1 560 442)">
    <rect x="474" y="420" width="220" height="46" rx="23" fill="#000000"/>
    <rect x="470" y="416" width="220" height="46" rx="23" fill="#fb4903" stroke="#000000" stroke-width="2.5"/>
    <text x="580" y="445" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="14" letter-spacing="1" fill="#ffffff">BOT &amp; AUTOMATION</text>
  </g>

  <!-- Sticker 4: Graphic Design -->
  <g transform="rotate(1.5 780 442)">
    <rect x="704" y="420" width="186" height="46" rx="23" fill="#000000"/>
    <rect x="700" y="416" width="186" height="46" rx="23" fill="#ffd731" stroke="#000000" stroke-width="2.5"/>
    <text x="793" y="445" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="14" letter-spacing="1" fill="#000000">GRAPHIC DESIGN</text>
  </g>

  <!-- Website URL Pill Button (Right aligned) -->
  <g>
    <rect x="906" y="418" width="180" height="48" rx="24" fill="#000000"/>
    <rect x="902" y="414" width="180" height="48" rx="24" fill="#000000" stroke="#000000" stroke-width="2.5"/>
    <text x="992" y="444" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="16" letter-spacing="1" fill="#ffffff">ziellvfx.com ↗</text>
  </g>

  <!-- Sub tags footer -->
  <text x="600" y="530" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="13" letter-spacing="2.5" fill="#888888">LINKS • CONTACT • TOOLS • PROJECTS</text>
</svg>
